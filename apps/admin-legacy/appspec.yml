version: 0.0
os: linux
files:
  - source: /build/
    destination: /var/www/html
hooks:
  ApplicationStart:
    - location: scripts/start.sh
      timeout: 30
      runas: ec2-user
  AfterInstall:
    - location: scripts/deploy.sh
      timeout: 10
      runas: ec2-user
  BeforeBlockTraffic:
    - location: scripts/stop.sh
      timeout: 30
      runas: ec2-user
